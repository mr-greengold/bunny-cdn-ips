name: Sync fork with upstream

on:
  schedule:
    # Every 6 hours, every day (UTC)
    # The upstream cron (5 2,14 * * 1-5) has variable delays, so
    # frequent syncing picks up updates as soon as they are available
    - cron: "5 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting fast-forward sync..."
          if ! gh repo sync ${{ github.repository }} -b main; then
            echo "Fast-forward failed (diverged fork?), performing hard reset..."
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
            cd repo
            git remote add upstream https://github.com/pothi/bunny-cdn-ips.git
            git fetch upstream main
            git checkout main
            git reset --hard upstream/main
            git push origin main --force
          else
            echo "Fast-forward sync completed."
          fi
